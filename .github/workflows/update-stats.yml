name: Update Monthly Visits

on:
  schedule:
    - cron: '0 0 * * 1'  # Cada lunes a las 00:00 UTC
  workflow_dispatch:     # Para ejecución manual

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Read current stats and compute new value
        id: compute
        run: |
          # Leer visits, con fallback a 54 si no existe o es inválido
          CURRENT=$(jq -r '.monthly_visits // 54' stats.json 2>/dev/null)
          if ! [[ "$CURRENT" =~ ^[0-9]+$ ]]; then
            CURRENT=54
          fi
          # Generar incremento entre 2 y 5 (usando timestamp como semilla)
          INCREMENT=$(( ( $(date +%N) % 4 ) + 2 ))
          NEW=$((CURRENT + INCREMENT))
          echo "NEW_VISITS=$NEW" >> $GITHUB_ENV
          echo "CURRENT=$CURRENT" >> $GITHUB_ENV

      - name: Update stats.json
        run: |
          jq --argjson n "${{ env.NEW_VISITS }}" \
             --arg date "$(date +%Y-%m-%d)" \
             '.monthly_visits = $n | .last_updated = $date' \
             stats.json > temp.json && mv temp.json stats.json

      - name: Commit and push
        run: |
          git config user.name "Visit Counter Bot"
          git config user.email "bot@oscarcardenas.com"
          git add stats.json
          git commit -m "📈 Updated visits to ${{ env.NEW_VISITS }} (was ${{ env.CURRENT }})"
          git push
